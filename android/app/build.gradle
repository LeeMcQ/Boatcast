plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.leemcq.boatcast'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.leemcq.boatcast'
        minSdk 26
        // 28 on purpose: Termux-style behaviour for the bundled server (no netlink limits),
        // and location (not NEARBY_WIFI_DEVICES) is the only runtime permission the hotspot needs.
        targetSdk 28
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '0.2.0'
    }

    // Release signing key comes from the environment (CI: GitHub secrets), never from the repo.
    // Without it the build is signed with a throwaway debug key and must not be published.
    def ks = System.getenv('BOATCAST_KEYSTORE')
    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('BOATCAST_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BOATCAST_KEY_ALIAS') ?: 'boatcast'
                keyPassword System.getenv('BOATCAST_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    // The Rust server ships as lib/<abi>/libboatcast.so and is run as a program,
    // so it must be extracted to nativeLibraryDir at install time.
    packaging {
        jniLibs { useLegacyPackaging true }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

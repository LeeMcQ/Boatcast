name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Publish a release on GitHub (e.g. tag v0.1.0) and this run attaches every download to it.
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (unit + end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release
      - run: cargo build --release
      - run: bash tests/smoke.sh

  browsers:
    name: Viewer page in Chrome, Firefox and Safari-engine (WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: python tests/browsers.py target/release/boatcast

  linux:
    name: Linux ${{ matrix.target }} (Termux, routers, Raspberry Pi)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ziglang cargo-zigbuild
      - run: rustup target add ${{ matrix.target }}
      - run: cargo zigbuild --release --target ${{ matrix.target }}
      - run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/boatcast dist/boatcast-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: boatcast-${{ matrix.target }}
          path: dist/*

  desktop:
    name: Laptop ${{ matrix.target }} (with HTTPS)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: '' }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --features tls --target ${{ matrix.target }}
      - name: Cross-platform end-to-end test
        shell: bash
        run: python tests/portable.py target/${{ matrix.target }}/release/boatcast${{ matrix.ext }}
      - shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/boatcast${{ matrix.ext }} dist/boatcast-tls-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: boatcast-tls-${{ matrix.target }}
          path: dist/*

  android:
    name: Android app (host + repeater)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Build the server for each Android ABI
        run: |
          NDK_BIN="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p dist
          build() {
            target=$1; abi=$2; clang=$3
            var="CARGO_TARGET_$(echo "$target" | tr 'a-z-' 'A-Z_')_LINKER"
            env "$var=$NDK_BIN/$clang" cargo build --release --target "$target"
            mkdir -p "android/app/src/main/jniLibs/$abi"
            cp "target/$target/release/boatcast" "android/app/src/main/jniLibs/$abi/libboatcast.so"
            cp "target/$target/release/boatcast" "dist/boatcast-$target"
          }
          build aarch64-linux-android   arm64-v8a   aarch64-linux-android26-clang
          build armv7-linux-androideabi armeabi-v7a armv7a-linux-androideabi26-clang
          build x86_64-linux-android    x86_64      x86_64-linux-android26-clang
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Mesh rules and simulation (unit tests)
        run: gradle -p android testReleaseUnitTest --no-daemon
      - name: Release signing key (GitHub secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            # Pasting on a phone can add spaces, line breaks or quotes, or the whole key file.
            # The key: the one long base64 run if there is one, else every base64 character.
            CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -s ' \t\r"' '\n' | awk 'length >= 1000' | head -1 | tr -cd 'A-Za-z0-9+/=')
            [ -n "$CLEAN" ] || CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=')
            # The password: the line after "Value:" under its name if the file was pasted, else the value itself.
            PASS=""
            for SRC in "$KEYSTORE_PASSWORD" "$KEYSTORE_B64"; do
              [ -n "$PASS" ] || PASS=$(printf '%s\n' "$SRC" | tr -d '\r' | awk '/ANDROID_KEYSTORE_PASSWORD/{f=1} f && /^Value/{getline; print; exit}' | tr -d ' \t"')
            done
            [ -n "$PASS" ] || PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t"')
            echo "Key secret: ${#CLEAN} base64 characters"
            if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null \
               || ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -storepass "$PASS" >/dev/null 2>&1; then
              echo "::error::The ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets don't open as a key (${#CLEAN} characters received). Paste them again, each value whole, with nothing added."
              exit 1
            fi
            echo "BOATCAST_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "BOATCAST_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key from secrets."
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets: this APK uses a throwaway key and will not be published."
            touch dist/THROWAWAY-KEY
          fi
      - run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk dist/boatcast.apk
      - name: Check the APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging dist/boatcast.apk | grep -E "package:|sdkVersion|targetSdkVersion|native-code|uses-permission" 
          "$BT/apksigner" verify --print-certs dist/boatcast.apk
          unzip -l dist/boatcast.apk | grep -E "lib/|classes.dex"
      - uses: actions/upload-artifact@v4
        with:
          name: boatcast-android
          path: dist/*

  android-emulator:
    name: Android emulator test
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boatcast-android
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # One retry: the emulator's Google services sometimes crash and take the app with them.
          script: bash tests/android-emulator.sh dist/boatcast.apk dist/boatcast-x86_64-linux-android || (echo "---- retrying once" && sleep 5 && bash tests/android-emulator.sh dist/boatcast.apk dist/boatcast-x86_64-linux-android)

  website-apk:
    name: Put the APK on the website
    # Every push to main that passes the Android tests replaces boatcast.apk on the site,
    # so https://leemcq.github.io/Boatcast/boatcast.apk always serves the latest build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, android-emulator, browsers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boatcast-android
          path: dist
      - name: Refuse an APK signed with a throwaway key
        run: |
          if [ -e dist/THROWAWAY-KEY ]; then
            echo "::error::No working signing-key secrets, so the website APK was not updated."
            exit 1
          fi
      - name: Commit boatcast.apk
        run: |
          cp dist/boatcast.apk boatcast.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boatcast.apk
          if git diff --cached --quiet; then echo "APK unchanged"; exit 0; fi
          git commit -m "Website APK from ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1

  release:
    name: Publish release
    if: github.event_name == 'release'
    needs: [test, linux, desktop, android, android-emulator, browsers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Refuse to publish an APK signed with a throwaway key
        run: |
          if [ -e dist/THROWAWAY-KEY ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD secrets (Settings, Secrets and variables, Actions), then publish the release again."
            exit 1
          fi
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*

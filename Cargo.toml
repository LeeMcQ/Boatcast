[package]
name = "boatcast"
version = "0.1.0"
edition = "2024"
description = "Offline Wi-Fi broadcaster for live slides and words: one small server, every phone follows in its browser"
license = "MIT"

[features]
default = []
# HTTPS for the installable app (PWA). Off by default to keep the build lean.
tls = ["dep:tokio-rustls"]

[dependencies]
bytes = "1.12.1"
flate2 = "1.1.11"
if-addrs = "0.15.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"], optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# panic stays "unwind": a bug in one phone's connection must not take the whole server down.

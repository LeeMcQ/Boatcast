<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Presenter console</title>
<style>
:root{--bg:#111418;--panel:#1a1f26;--fg:#eef1f4;--dim:#93a0ad;--line:#2b333d;--acc:#4da3ff;--warn:#e5a00d;--bad:#e5484d;--ok:#2fbf4a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.2rem;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
header b{font-size:1.05rem}
.pill{font-size:.85rem;color:var(--dim)} .pill strong{color:var(--fg)}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1rem;padding:1rem;max-width:1400px;margin:auto}
@media (max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:.9rem}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 .6rem}
#now{min-height:12rem;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-wrap;font-size:1.5rem;line-height:1.3;background:#000;border-radius:.6rem;padding:1rem;overflow:hidden}
#now img{max-width:100%;max-height:16rem;object-fit:contain}
#now.blank{opacity:.35}
#next{color:var(--dim);font-size:.95rem;margin-top:.5rem;white-space:pre-wrap;max-height:4.5rem;overflow:hidden}
#notes{color:var(--warn);font-size:.95rem;margin-top:.5rem;white-space:pre-wrap}
.ctrls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem;margin-top:.8rem}
button{font:inherit;color:var(--fg);background:#232a33;border:1px solid var(--line);border-radius:.6rem;padding:.7rem 1rem;cursor:pointer}
button:hover{border-color:var(--acc)} button:disabled{opacity:.4;cursor:not-allowed}
.big{font-size:1.25rem;padding:1rem;font-weight:600}
#nextBtn{background:var(--acc);color:#001;border-color:var(--acc)}
#blankBtn.on{background:var(--warn);color:#000;border-color:var(--warn)}
#list{display:flex;flex-direction:column;gap:.3rem;max-height:22rem;overflow:auto}
#list button{text-align:left;padding:.45rem .7rem;display:flex;gap:.6rem;font-size:.92rem}
#list button.cur{border-color:var(--acc);background:#18304a}
#list .n{color:var(--dim);min-width:1.8rem}
#list .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
textarea,input{width:100%;font:inherit;color:var(--fg);background:#0d1014;border:1px solid var(--line);border-radius:.5rem;padding:.55rem}
textarea{min-height:8rem;resize:vertical}
.row{display:flex;gap:.5rem;margin-top:.5rem}
.qrs{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;text-align:center}
.qrs img{width:100%;background:#fff;border-radius:.4rem;padding:.3rem}
.qrs p{margin:.3rem 0 0;font-size:.8rem;color:var(--dim);word-break:break-all}
#card{position:fixed;inset:0;background:#fff;color:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:9;padding:2rem;cursor:pointer}
#card.open{display:flex}
#card .two{display:flex;gap:6vw;flex-wrap:wrap;justify-content:center}
#card figure{margin:0;text-align:center} #card img{width:min(38vw,60vh)} #card figcaption{font-size:clamp(1rem,2.4vw,1.8rem);margin-top:.5rem}
#card h1{margin:0;font-size:clamp(1.4rem,3.5vw,3rem)}
#msg{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--bad);color:#fff;padding:.6rem 1rem;border-radius:.5rem;display:none}
.relay #ctrlPanel button,.relay #textPanel button{pointer-events:none;opacity:.4}
</style>
</head>
<body>
<header>
  <b>Presenter console</b>
  <span class="pill">Mode <strong id="mode">…</strong></span>
  <span class="pill">Phones <strong id="clients">0</strong></span>
  <span class="pill">Slide <strong id="pos">–</strong></span>
  <span class="pill" id="upPill" hidden>Upstream <strong id="up">…</strong></span>
  <span class="pill">Phones open <strong id="url">…</strong></span>
</header>
<main>
  <div>
    <section id="ctrlPanel">
      <h2>Live now</h2>
      <div id="now">…</div>
      <div id="next"></div>
      <div id="notes"></div>
      <div class="ctrls">
        <button class="big" id="prevBtn" title="Left arrow">◀ Prev</button>
        <button class="big" id="blankBtn" title="B">Blank</button>
        <button class="big" id="nextBtn" title="Right arrow or Space">Next ▶</button>
      </div>
    </section>
    <section style="margin-top:1rem">
      <h2>Slides</h2>
      <div id="list"></div>
    </section>
  </div>
  <div>
    <section>
      <h2>Join codes</h2>
      <div class="qrs">
        <div><img id="qrWifi" alt="Wi-Fi QR code"><p id="ssid">Wi-Fi</p></div>
        <div><img id="qrUrl" alt="Page QR code"><p id="url2"></p></div>
      </div>
      <div class="row"><button id="cardBtn" style="flex:1">Show join card full screen</button></div>
    </section>
    <section id="textPanel" style="margin-top:1rem">
      <h2>Live text (phones only)</h2>
      <input id="liveText" placeholder="Short notice or interpretation line" maxlength="280">
      <div class="row"><button id="sendText" style="flex:1">Send</button><button id="clearText">Clear</button></div>
      <h2 style="margin-top:1rem">Type or paste slides</h2>
      <textarea id="newSlides" placeholder="One slide per block. Leave a blank line between slides.&#10;# A line starting with # becomes the slide title"></textarea>
      <div class="row"><input id="newTitle" placeholder="Deck title" style="flex:1"><button id="loadText">Load slides</button></div>
    </section>
  </div>
</main>
<div id="card" title="Click to close">
  <h1>Follow along on your phone</h1>
  <div class="two">
    <figure><img id="cWifi" alt=""><figcaption>1 · Join Wi-Fi <b id="cSsid"></b></figcaption></figure>
    <figure><img id="cUrl" alt=""><figcaption>2 · Open <b id="cUrlText"></b></figcaption></figure>
  </div>
  <p>Turn mobile data off if the page does not open.</p>
</div>
<div id="msg"></div>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  let pin = ""; try { pin = sessionStorage.getItem("pin") || ""; } catch (e) {}
  let st = null, deck = null, deckVer = null, busy = false, lastSlide = -1, warned = false;

  function toast(t) { const m = $("msg"); m.textContent = t; m.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = "none", 3500); }
  function askPin() {
    const p = prompt("Presenter PIN");
    if (p !== null) { pin = p.trim(); try { sessionStorage.setItem("pin", pin); } catch (e) {} }
  }

  async function control(body) {
    const r = await fetch("/control", { method: "POST", headers: { "Content-Type": "application/json", "X-Pin": pin }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 403) { askPin(); throw new Error("pin"); }
    if (!r.ok) { toast(j.error || ("Error " + r.status)); throw new Error(j.error); }
    poll();
    return j;
  }
  const act = (a, extra) => control(Object.assign({ action: a }, extra || {})).catch(() => {});

  async function loadDeck() {
    try {
      let r = await fetch("/api/deck-full", { headers: { "X-Pin": pin } });
      if (r.status === 403) r = await fetch("/deck.json"); // relay, or no PIN yet: no speaker notes
      deck = await r.json(); deckVer = deck.version; renderList(); renderNow();
    } catch (e) {}
  }

  function label(s, i) { return (s.title || (s.text || "").split("\n")[0] || (s.image ? "Image" : "")) || `Slide ${i + 1}`; }
  function renderList() {
    const L = $("list"); L.innerHTML = "";
    (deck ? deck.slides : []).forEach((s, i) => {
      const b = document.createElement("button");
      b.innerHTML = `<span class="n">${i + 1}</span><span class="t"></span>`;
      b.querySelector(".t").textContent = label(s, i);
      b.onclick = () => act("goto", { slide: i });
      L.appendChild(b);
    });
    markList();
  }
  function markList() {
    if (!st) return;
    [...$("list").children].forEach((b, i) => b.classList.toggle("cur", i === st.slide));
    const cur = $("list").children[st.slide];
    if (cur && st.slide !== lastSlide) { cur.scrollIntoView({ block: "nearest" }); lastSlide = st.slide; }
  }
  function renderNow() {
    if (!deck || !st) return;
    const s = deck.slides[st.slide] || {}, n = deck.slides[st.slide + 1];
    const now = $("now"); now.innerHTML = "";
    if (s.image) { const im = document.createElement("img"); im.src = s.image; im.alt = label(s, st.slide); now.appendChild(im); }
    else now.textContent = s.text || s.title || "";
    now.classList.toggle("blank", !!st.blank);
    $("next").textContent = n ? "Next: " + label(n, st.slide + 1) : "End of deck";
    $("notes").textContent = s.notes ? "Notes: " + s.notes : "";
  }

  async function poll() {
    if (busy) return; busy = true;
    try {
      const r = await fetch("/status", { headers: { "X-Pin": pin }, cache: "no-store" });
      st = await r.json();
      document.body.classList.toggle("relay", st.mode === "relay");
      $("mode").textContent = st.mode === "relay" ? "relay (read-only)" : "host";
      $("clients").textContent = st.clients;
      $("pos").textContent = `${st.slide + 1} / ${st.slides}${st.blank ? " · blank" : ""}`;
      $("url").textContent = st.url; $("url2").textContent = st.url;
      $("upPill").hidden = !st.upstream;
      if (st.upstream) $("up").textContent = st.upstream.connected ? "connected" : "reconnecting…";
      $("ssid").textContent = st.ssid ? "Wi-Fi: " + st.ssid : "Start with --wifi-ssid to show this code";
      $("blankBtn").classList.toggle("on", !!st.blank);
      $("liveText").placeholder = st.text ? "Showing: " + st.text : "Short notice or interpretation line";
      if (st.deck !== deckVer) await loadDeck(); else { markList(); renderNow(); }
      if (st.auth === "local-only" && !warned) { warned = true; toast("Console works on this device only (start with --pin to allow others)"); }
    } catch (e) {
      $("mode").textContent = "offline?";
    }
    busy = false;
  }

  function loadQrs() {
    const t = Date.now();
    $("qrUrl").src = $("cUrl").src = "/qr/url.svg?t=" + t;
    $("qrWifi").src = $("cWifi").src = "/qr/wifi.svg?t=" + t;
  }
  $("qrWifi").onerror = () => { $("qrWifi").style.visibility = "hidden"; };

  $("prevBtn").onclick = () => act("prev");
  $("nextBtn").onclick = () => act("next");
  $("blankBtn").onclick = () => act("blank");
  $("sendText").onclick = () => act("text", { text: $("liveText").value }).then(() => $("liveText").value = "");
  $("clearText").onclick = () => act("text", { text: null });
  $("liveText").addEventListener("keydown", (e) => { if (e.key === "Enter") $("sendText").click(); });
  $("loadText").onclick = () => {
    const text = $("newSlides").value;
    if (!text.trim()) return toast("Type some slides first");
    act("load_text", { text, title: $("newTitle").value || "Slides" });
  };
  $("cardBtn").onclick = () => {
    $("cSsid").textContent = st && st.ssid ? st.ssid : "";
    $("cUrlText").textContent = st ? st.url : "";
    loadQrs(); $("card").classList.add("open");
  };
  $("card").onclick = () => $("card").classList.remove("open");
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input,textarea")) return;
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); act("next"); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); act("prev"); }
    else if (e.key === "b" || e.key === "B" || e.key === ".") act("blank");
    else if (e.key === "Escape") $("card").classList.remove("open");
  });

  if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("/sw.js").catch(() => {});
  loadQrs(); poll(); setInterval(poll, 2000);
})();
</script>
</body>
</html>
